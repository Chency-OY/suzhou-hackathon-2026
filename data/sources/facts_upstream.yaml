# =============================================================================
# 16. 医生问诊映射（问题 → 依据）
# =============================================================================
qa_mapping:
  - id: qa.bmi
    question: "身高体重多少？我算一下 BMI"
    basis: "BMI 24/28 切点与肥胖分级"
    refs: [guide.obesity2024.bmi_cutoff, guide.obesity2024.grading, label.indication.weight]
  - id: qa.waist
    question: "腰围多少？"
    basis: "中心性肥胖腰围切点（男 ≥90 / 女 ≥85 cm）"
    refs: [guide.obesity2024.waist]
  - id: qa.comorbidity
    question: "有没有高血压、脂肪肝、打呼噜、血糖高？"
    basis: "超重（BMI 24–28）需伴至少一种体重相关合并症才符合药物治疗条件"
    refs: [label.indication.weight, guide.obesity2024.bmi_cutoff]
  - id: qa.history
    question: "以前减过吗？怎么减的？反弹没有？"
    basis: "体重管理规范化流程：分类→评估→干预→维持→随访"
    refs: [guide.weight2024.scope]
  - id: qa.goal
    question: "想减多少？能接受打针吗？"
    basis: "减重目标分层 5%–15% / 3–6 个月，每 3–6 个月评估"
    refs: [guide.obesity2024.target]
  - id: qa.glucose
    question: "最近查过血糖、糖化血红蛋白吗？"
    basis: "T2DM 占糖尿病 90% 以上、知晓率仅 36.7%；糖尿病指南设体重管理专章"
    refs: [guide.diabetes2024.epi, guide.diabetes2024.toc]
  - id: qa.thyroid
    question: "家里有没有人得过甲状腺髓样癌？有没有 MEN 2？"
    basis: "说明书黑框警告与禁忌"
    refs: [label.warning.mtc, label.contraindication]
  - id: qa.gi
    question: "平时胃怎么样？有没有胰腺炎、胆囊问题？"
    basis: "说明书注意事项中胰腺炎、胆囊疾病、重度胃肠道疾病与胃肠道不良反应"
    refs: [label.warning.pancreatitis, label.warning.gallbladder, safety.gi.glory1]
  - id: qa.pregnancy
    question: "近期有生育计划吗？"
    basis: "妊娠期禁用；计划妊娠前停用至少 3 个月"
    refs: [dose.pregnancy]

