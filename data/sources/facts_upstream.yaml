# 9. 指南与共识（支撑「医生为什么会这么问」）
# =============================================================================
guidelines:

  obesity_2024:
    id: guide.obesity2024
    title: "肥胖症诊疗指南（2024年版）"
    issuer: "国家卫生健康委办公厅"
    document_number: "国卫办医政函〔2024〕382号"
    issued_date: "2024-10-12"
    published_online: "2024-10-17"
    nature: "国家层面诊疗指南（首部由国家卫健委发布的肥胖症诊疗指南）"
    urls:
      notice: "https://www.nhc.gov.cn/wjw/c100378/202410/bcf804e19e0c4246b5aea6cd338b55e1.shtml"
      pdf: "https://www.nhc.gov.cn/cms-search/downFiles/d62bf58fae134eaf84c4fb77d6762a08.pdf"
    evidence: E4_OFFICIAL
    status: verified
    quotable:
      - id: guide.obesity2024.bmi_cutoff
        topic: "BMI 诊断切点"
        quote: |
          在我国成年人群中，BMI 低于 18.5 kg/m² 为低体重状态，达到 18.5 kg/m² 且低于 24 kg/m² 为正常体重，达到 24 kg/m² 且低于 28 kg/m² 为超重，达到或超过 28 kg/m² 为肥胖症。
        section: "第四章 肥胖症的定义、诊断标准、分型、分期及相关疾病"
      - id: guide.obesity2024.grading
        topic: "肥胖症四级分级"
        quote: |
          建议 BMI 达到 28.0 kg/m² 且低于 32.5 kg/m² 为轻度肥胖症、达到 32.5 kg/m² 且低于 37.5 kg/m² 为中度肥胖症、达到 37.5 kg/m² 且低于 50 kg/m² 为重度肥胖症、达到或超过 50 kg/m² 为极重度肥胖症。
        section: "同上"
      - id: guide.obesity2024.waist
        topic: "中心性肥胖腰围切点"
        quote: |
          正常腰围定义为 <85 cm（男性）和 <80 cm（女性），腰围 ≥90 cm（男性）和 ≥85 cm（女性）即可诊断为中心性肥胖。……当 WHR ≥0.90（男性）和 ≥0.85（女性）时，也可诊断为中心性肥胖。
        section: "同上，基于体型特征的诊断标准"
      - id: guide.obesity2024.target
        topic: "减重目标分层"
        quote: |
          对于大多数超重和轻度肥胖症患者，可设定为在 3-6 个月之内至少将体重降低 5%-15% 并维持；对于中、重度肥胖症患者则可设定更高的减重目标……建议每 3-6 个月对减重效果和代谢指标进行评估。
        section: "第六章 肥胖症的治疗原则"
      - id: guide.obesity2024.modalities
        topic: "治疗手段构成"
        quote: |
          肥胖症治疗有多种手段，主要包括：行为心理干预、运动干预、临床营养治疗、药物治疗、外科手术治疗以及中医药治疗等。……一般建议所有患者均应接受营养、运动、心理指导作为全程基础管理。
        section: "第六章"
    compliance_note:
      id: guide.obesity2024.compliance
      value: "本指南发布于 2024-10-12，玛仕度肽 2025-06-24 获批，2024 版指南药物治疗章节不可能纳入玛仕度肽"
      rule: "禁止声称「指南推荐玛仕度肽」，禁止把其他药物的推荐等级移用至本品"
      evidence: E4_OFFICIAL
    unverified:
      id: guide.obesity2024.druglist
      value: "网络媒体报道该指南列出奥利司他、利拉鲁肽、贝那鲁肽、司美格鲁肽、替尔泊肽五种减重药物"
      status: unverified
      reason: "未从指南 PDF 正文逐字核对，引用前须回原文「药物治疗」章节确认"

  weight_management_2024:
    id: guide.weight2024
    title: "体重管理指导原则（2024年版）"
    issuer: "国家卫生健康委办公厅"
    document_number: "国卫办医急函〔2024〕469号"
    issued_date: "2024-12-05"
    nature: "指导原则，配套「体重管理年」活动实施方案，委托国家心血管病中心牵头制定"
    url: "https://www.nhc.gov.cn/wjw/ylyjs/202412/b3d40e0141834897808ce6c9dce76a60.shtml"
    evidence: E4_OFFICIAL
    status: verified
    quotable:
      - id: guide.weight2024.scope
        topic: "文件定位与内容框架"
        quote: |
          为进一步落实《「体重管理年」活动实施方案》，强化慢性病防治关口前移……我委委托国家心血管病中心牵头，组织相关领域专家，针对超重肥胖等体重问题的规范化管理制定了《体重管理指导原则（2024年版）》。主要内容包括体重的分类标准、体重管理相关评估、超重肥胖的干预和治疗、健康体重的管理与维持、特殊人群的体重管理、规范化体重管理流程等，供各地推广使用。
        source: "卫健委官方解读"
      - id: guide.weight2024.epidemiology
        topic: "流行病学数据"
        quote: |
          根据《中国居民营养与慢性病状况报告（2020 年）》，2018 年我国成人超重率和肥胖率分别为 34.3% 和 16.4%，与 2002 年的 22.8% 和 7.1% 相比大幅增长；6～17 岁儿童青少年超重率和肥胖率分别为 11.1% 和 7.9%，并呈逐年递增趋势。
        source: "指导原则正文（PDF）"
    caveat:
      id: guide.weight2024.caveat
      value: "正文要点引自卫健委官方解读与省级转发 PDF；逐条引用具体条款时应下载原文附件核对页码"
      status: partial

  diabetes_2024:
    id: guide.diabetes2024
    title: "中国糖尿病防治指南（2024版）"
    issuer: "中华医学会糖尿病学分会（CDS）"
    document_number: null
    document_number_note: "属学会指南，无政府发文号；不得写作「国家卫健委发布」"
    publication: "《中华糖尿病杂志》2025 年第 17 卷第 1 期，第 16-139 页"
    release_date: "2024-12-31（期刊官网发布）"
    correspondence_authors: ["朱大龙（南京大学医学院附属鼓楼医院）", "郭立新（北京医院）"]
    structure: "共 20 章，含第九章「高血糖的药物治疗」、第十章「2 型糖尿病患者的体重管理」"
    evidence: E4_OFFICIAL
    status: verified
    quotable:
      - id: guide.diabetes2024.toc
        topic: "章节构成"
        quote: |
          本指南共 20 章，内容涵盖中国糖尿病的流行病学、诊断与分型、三级预防、筛查和评估、教育和管理、2 型糖尿病综合控制目标和高血糖的治疗路径、医学营养治疗、运动治疗、高血糖的药物治疗、2 型糖尿病患者的体重管理、糖尿病相关技术、急性并发症……
      - id: guide.diabetes2024.epi
        topic: "流行病学要点"
        quote: |
          1. 我国糖尿病患病率仍在上升，由 2013 年的 10.9% 增加到 2018 至 2019 年的 12.4%。……3. 糖尿病人群中 2 型糖尿病（T2DM）占 90% 以上。
          5. 糖尿病知晓率（36.7%）、治疗率（32.9%）和控制率（50.1%）提升缓慢。
        section: "第一章 要点提示"
    citation_rule:
      id: guide.diabetes2024.citation
      value: "引用出处须写《中华糖尿病杂志》2025;17(1):16-139，不得写机关文号"

