# =============================================================================
# 2. 适应症（两套，严格分离）
# =============================================================================
indications:

  weight_management:
    id: label.indication.weight
    label_version: "减重版（核准 2025-06-24）"
    headline: "用于在控制饮食和增加体力活动基础上对成人患者的长期体重控制"
    criteria:
      - {op: "BMI ≥ 28 kg/m²", meaning: "肥胖"}
      - {op: "BMI ≥ 24 kg/m²", meaning: "超重，且须伴有至少一种体重相关合并症"}
    comorbidities_listed:
      - "高血糖"
      - "高血压"
      - "血脂异常"
      - "脂肪肝"
      - "阻塞性睡眠呼吸暂停综合征"
    comorbidity_note: "说明书以「例如……等」列举，非穷尽清单"
    quote: |
      本品适用于在控制饮食和增加体力活动基础上对成人患者的长期体重控制，初始体重指数（BMI）为：
      • BMI ≥28 kg/m²（肥胖），或
      • BMI ≥24 kg/m²（超重），并伴有至少一种体重相关的合并症（例如高血糖、高血压、血脂异常、脂肪肝、阻塞性睡眠呼吸暂停综合征等）。
    source: "label.md#【适应症】"
    evidence: E1_LABEL
    status: verified

  type2_diabetes:
    id: label.indication.t2dm
    label_version: "T2DM 版（核准 2025-09-16）"
    headline: "适用于成人 2 型糖尿病患者的血糖控制"
    monotherapy:
      value: "单纯饮食控制和运动干预后血糖仍控制不佳的成人 2 型糖尿病患者"
    combination:
      value: "在饮食控制和运动基础上，接受二甲双胍和/或磺脲类药物、接受二甲双胍和/或 SGLT2i 类药物治疗血糖仍控制不佳的成人 2 型糖尿病患者"
    note: "T2DM 适应症未设 BMI 门槛"
    quote: |
      本品适用于成人2 型糖尿病患者的血糖控制：
      单药治疗 单纯饮食控制和运动干预后血糖仍控制不佳的成人2 型糖尿病患者；
      联合治疗 在饮食控制和运动基础上，接受二甲双胍和/或磺脲类药物、接受二甲双胍和/或钠-葡萄糖共转运蛋白2 抑制剂（SGLT2i）类药物治疗血糖仍控制不佳的成人2 型糖尿病患者。
    source: "label.md#【适应症】"
    evidence: E1_LABEL
    status: verified

  off_label_boundaries:
    id: label.indication.boundary
    not_approved:
      - {population: "18 岁以下儿童及青少年", basis: "【儿童用药】安全性与有效性尚未确定"}
      - {population: "妊娠期妇女", basis: "【注意事项】明确禁用于妊娠期妇女"}
      - {population: "终末期肾病患者", basis: "无临床研究数据"}
      - {population: "中度、重度肝功能不全患者", basis: "无临床研究数据"}
      - {population: "1 型糖尿病", basis: "说明书适应症仅限 2 型糖尿病"}
      - {population: "有 MTC 个人/家族史或 MEN 2 的患者", basis: "【禁忌】"}
      - {population: "急性胆囊疾病患者", basis: "【注意事项】不推荐使用"}
      - {population: "重度胃肠道疾病患者", basis: "【注意事项】不推荐使用"}
    evidence: E1_LABEL
    status: verified

# =============================================================================
# 3. 用法用量
# =============================================================================
dosing:

  both_indications_shared:
    route:
      id: dose.route
      value: "皮下注射，每周一次"
      detail:
        - "可在一天中任意时间注射，无需根据进餐时间给药"
        - "可在腹部皮下注射；不可静脉或肌肉注射"
        - "首次使用前由医护专业人员提供皮下注射技术指导，此后患者可自行注射或由护理人员注射"
        - "可改变每周给药日期，但两剂间隔须至少 5 天（> 120 小时）"
      evidence: E1_LABEL
      status: verified

    starting_dose:
      id: dose.start
      value: 2
      unit: "mg"
      note_t2dm: "T2DM 版明确「2 mg 的剂量目的是起始治疗而非控制血糖」"
      evidence: E1_LABEL
      status: verified

    maintenance:
      id: dose.maintenance
      value: [4, 6]
      unit: "mg"
      note: "推荐维持剂量 4 mg 或 6 mg；如 6 mg 不耐受可回调至 4 mg"
      evidence: E1_LABEL
      status: verified

    titration:
      id: dose.titration
      value:
        - {weeks: "1–4", dose_mg: 2, type: "滴定剂量"}
        - {weeks: "5–8", dose_mg: 4, type: "滴定剂量"}
        - {weeks: "≥9", dose_mg: 4, type: "维持剂量（或 6 mg）"}
      rule: "每档至少 4 周后方可递增；增至 6 mg 需在当前剂量治疗至少 4 周"
      evidence: E1_LABEL
      status: verified

    missed_dose:
      id: dose.missed
      value:
        - {gap: "≤2 天（距上次给药 ≤9 天）", action: "尽快给药，下一剂按原计划日期"}
        - {gap: "2–7 天（距上次给药 9–14 天）", action: "尽快给药，并重新计算每周给药日期"}
        - {gap: "7–21 天（距上次给药 14–28 天）", action: "下调至前 1 个剂量，重新开始滴定"}
        - {gap: ">21 天（距上次给药 >28 天）", action: "下调至起始剂量，按表 1 重新滴定"}
      evidence: E1_LABEL
      status: verified

  indication_specific:
    weight_management_dose_intent:
      id: dose.weight.intent
      value: "增至 6 mg 的触发语为「如需进一步改善体重」"
    t2dm_dose_intent:
      id: dose.t2dm.intent
      value: "增至 6 mg 的触发语为「如需进一步加强血糖控制」"
    t2dm_combination_rules:
      id: dose.t2dm.combo
      value:
        - "在二甲双胍基础上加用本品时，可继续二甲双胍当前剂量"
        - "与磺脲类联合时应考虑减少磺脲类剂量，以降低低血糖风险"
      evidence: E1_LABEL
      status: verified

  population_specific:
    hepatic:
      id: dose.hepatic
      value: "轻度肝功能不全无需调整剂量"
      detail: "轻度定义：TBIL ≤ULN 且 AST >ULN，或 TBIL >1～1.5×ULN 且任意 AST；中度、重度无数据"
      evidence: E1_LABEL
      status: verified
    renal:
      id: dose.renal
      value: "轻、中、重度肾功能不全均无需调整剂量"
      detail: "轻度 GFR 60–89、中度 30–59、重度 15–29 ml/min；中重度用药经验有限，应谨慎；终末期肾病无数据"
      evidence: E1_LABEL
      status: verified
    elderly:
      id: dose.elderly
      value: "65 岁及以上患者有限（减重 III 期试验中 N=3），尚无法确定安全性与有效性"
      evidence: E1_LABEL
      status: verified
    pediatric:
      id: dose.pediatric
      value: "18 岁以下安全性与有效性尚未确定"
      evidence: E1_LABEL
      status: verified
    pregnancy:
      id: dose.pregnancy
      value: "禁用于妊娠期妇女"
      detail: "计划妊娠前应停用玛仕度肽至少 3 个月（因半衰期较长）；治疗期间建议有生育能力女性避孕"
      evidence: E1_LABEL
      status: verified

  interactions:
    id: dose.interactions
    value:
      - {drug: "胰岛素 / 胰岛素促泌剂（如磺脲类）", effect: "联用增加低血糖风险，起始本品时应考虑减量", evidence: E1_LABEL}
      - {drug: "口服药物（一般）", effect: "GLP-1 类延缓胃排空，可能影响伴随口服药吸收；治疗窗窄药物（如华法林）需密切监测", evidence: E1_LABEL}
      - {drug: "阿托伐他汀", effect: "AUCinf +22.5%，Cmax −22.8%", evidence: E1_LABEL}
      - {drug: "地高辛", effect: "AUCinf +12.5%，Cmax −35.2%", evidence: E1_LABEL}
      - {drug: "二甲双胍", effect: "AUCinf −15.6%，Cmax −43.6%", evidence: E1_LABEL}
      - {drug: "华法林", effect: "AUCinf +11.4%，Cmax +2.3%", evidence: E1_LABEL}
    label_conclusion: "预期上述变化不会产生具有临床意义的影响"
    status: verified

  overdose:
    id: dose.overdose
    value: "无用药过量临床数据；参照其他 GLP-1 类药物，过量可致重度恶心、呕吐、低血糖；因半衰期长，症状可能需长时间观察或治疗"
    evidence: E1_LABEL
    status: verified

