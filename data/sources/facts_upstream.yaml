  id: label.contraindication
  value:
    - "已知对本品活性成份或任何辅料过敏者"
    - "甲状腺髓样癌（MTC）个人既往病史或家族病史"
    - "2 型多发性内分泌肿瘤综合征（MEN 2）患者"
  quote: |
    已知对本品活性成份或本品中任何辅料过敏者。甲状腺髓样癌（MTC）个人既往病史或家族病史，或2 型多发性内分泌肿瘤综合征患者（MEN 2）（见【注意事项】）。
  source: "label.md#【禁忌】（两版一致）"
  evidence: E1_LABEL
  status: verified
  caveat: "妊娠期禁用写在【注意事项】而非【禁忌】项下，见 discrepancies D13"

boxed_warning:
  id: label.warning.mtc
  title: "警告：甲状腺 C 细胞肿瘤风险"
  value:
    - "啮齿类动物在临床相关暴露水平下可出现甲状腺 C 细胞肿瘤"
    - "尚不清楚是否引起人类甲状腺 C 细胞肿瘤（含 MTC），因动物与人类相关性未确定"
    - "禁用于有 MTC 既往史/家族史及 MEN 2 患者；应告知患者可能的 MTC 风险及甲状腺肿瘤症状"
  symptoms_to_teach: ["颈部肿块", "吞咽困难", "呼吸困难", "持续性声音嘶哑"]
  calcitonin_note: "MTC 患者降钙素通常 >50 ng/L；常规筛查降钙素或超声的价值尚不明确"
  evidence: E1_LABEL
  status: verified

key_warnings:
  id: label.warning.others
  items:
    - id: label.warning.anesthesia
      topic: "全身麻醉或深度镇静相关误吸"
      value: "GLP-1 受体激动剂有麻醉/深度镇静时肺误吸报道；术前应考虑胃排空延迟导致的内容物残留风险"
    - id: label.warning.pancreatitis
      topic: "急性胰腺炎"
      value: "III 期试验中玛仕度肽组 1 例（胆结石所致阻塞性、轻症，Atlanta 分级）；安慰剂组 0 例；怀疑胰腺炎应停药并治疗"
    - id: label.warning.gallbladder
      topic: "急性胆囊疾病"
      value: "III 期试验胆石症 2.0% vs 安慰剂 1.0%；胆囊炎 1.0% vs 1.5%；急性胆囊疾病患者不推荐使用"
    - id: label.warning.hr
      topic: "心率增加"
      value: "应常规监测心率；静息心率持续增加则停药"
    - id: label.warning.hypersensitivity
      topic: "过敏反应"
      value: "III 期试验过敏反应 3.5% vs 安慰剂 1.5%，无严重过敏反应"
    - id: label.warning.aki
      topic: "急性肾损伤"
      value: "III 期试验无报告；胃肠道反应可致脱水继而 AKI；起始与剂量递增时应监测肾功能"
    - id: label.warning.gi
      topic: "重度胃肠道不良反应"
      value: "III 期试验重度胃肠道不良反应发生率 2.0%；重度胃肠道疾病患者不推荐使用"
    - id: label.warning.driving
      topic: "驾驶与机械操作"
      value: "影响很小或可忽略；可能出现头晕（多在剂量递增期），发生时谨慎驾驶"
    - id: label.warning.suicide
      topic: "自杀行为或意念"
      value: "玛仕度肽治疗者中尚无报告；应监测抑郁/自杀意念，出现即停药；有自杀企图史者应避免使用"
  evidence: E1_LABEL
  status: verified

