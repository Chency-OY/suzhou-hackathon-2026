# =============================================================================
# facts.yaml — 信尔美®（玛仕度肽注射液 / mazdutide）事实库
# -----------------------------------------------------------------------------
# 用途：作为下游抽取（Codex）的唯一事实源。所有对外表述必须先在此库命中事实，
#       未命中的内容一律视为「无依据」，不得生成。
# 生成日期：2026-10-25
# 上游材料：
#   - label.md              说明书原文（NMPA 核准，38k 字）
#   - trials_核验.md         6 项临床试验文献核验
#   - guidelines_核验.md     3 份指南/指导原则核验
#   - regulations_核验.md    7 部法规/行业规范核验
# 编写原则：
#   1. 只收录四份上游材料中出现过的事实，不引入外部知识；
#   2. 数字保留原文精度，不做二次换算或四舍五入；
#   3. 每项事实带 evidence（证据等级）与 status（核验状态），并尽量附 quote 原文；
#   4. 已知冲突不进正文，统一沉到 discrepancies，避免下游把不可比数字混用。
# =============================================================================

schema_version: "1.0"
generated_at: "2026-10-25"
language: "zh-CN"
subject:
  product: "信尔美（玛仕度肽注射液）"
  company: "信达生物制药（苏州）有限公司"

# -----------------------------------------------------------------------------
# 字段约定（供 Codex 解析）
# -----------------------------------------------------------------------------
field_conventions:

  id:
    desc: "稳定事实标识；下游引用格式为双方括号包住该 id"
    pattern: "<domain>.<subject>.<metric>[.<arm>]"
    domains: ["product", "label", "dose", "safety", "pk", "efficacy", "trial",
              "competitor", "guide", "reg", "rule", "claim"]

  evidence:
    desc: "证据等级，从高到低；同一事实有多个来源时取最高等级，其余进 corroborated_by"
    codes:
      E1_LABEL:    "NMPA 核准说明书原文（行政许可文件，最高效力）"
      E2_PEER:     "同行评审论文 / PubMed 官方摘要"
      E3_REGISTRY: "ClinicalTrials.gov 注册信息或已登记结果"
      E4_OFFICIAL: "政府机关、学会官方发布（卫健委 / NMPA / 法工委 / 学会期刊）"
      E5_SPONSOR:  "申办方新闻稿、学术会议口头报告（未经同行评审）"
      E6_MEDIA:    "行业媒体、二手转载"

  status:
    desc: "核验状态"
    values:
      verified:   "已从一手来源逐字核对"
      partial:    "部分字段已核，或来源非一手"
      unverified: "未能核实，引用前必须复核"
      deprecated: "已废止 / 已被新版本取代，禁止引用"

  quote:
    desc: "原文摘录，逐字复制，不改编、不断句改写；仅可能调整排版空白"

# -----------------------------------------------------------------------------
# 使用契约：Codex 抽取时必须遵守
# -----------------------------------------------------------------------------
usage_contract:
  rules:
    - id: U1
      rule: "任何数值型表述必须带 unit 与 fact id；无 fact id 的数字禁止输出。"
    - id: U2
      rule: "禁止跨 trial 合并数据（如把 GLORY-1 与 GLORY-2 的减重率取平均）。"
    - id: U3
      rule: "禁止混用同一试验的不同口径（mITT 多重填补 / MMRM / treatment-policy），见 discrepancies D7。"
    - id: U4
      rule: "status 非 verified 的事实，输出时必须加限定语，并在文末列「待复核项」。"
    - id: U5
      rule: "涉及对外传播（面向医生以外受众）时，必须先过 claims_policy.forbidden 与 compliance_rules，任一命中即拒答。"
    - id: U6
      rule: "不得声称任何指南推荐玛仕度肽，见 discrepancies D11。"
    - id: U7
      rule: "DREAMS-3 数据只可标注为「申办方新闻稿/ADA 2026 口头报告」，不得表述为「已发表研究结果」。"
    - id: U8
      rule: "说明书两套适应症（减重版 / T2DM 版）不可交叉引用：适应症、禁忌、不良反应表、临床试验数据均各自独立。"
    - id: U9
      rule: "引用法规必须带条款号；不得引用 deprecated 清单内的任何文件。"
    - id: U10
      rule: "输出中的疗效表述不得超出 label.indications 与 label.efficacy 已载明的范围（广告法 §16Ⅱ、21 号令 §5）。"

  output_requirements:
    - "每个疗效数字后以双方括号附其 fact id"
    - "每个法规条款后附 (法规简称 §条款)"
    - "待复核项单列一节，格式：fact_id — 原因 — 建议核验途径"

