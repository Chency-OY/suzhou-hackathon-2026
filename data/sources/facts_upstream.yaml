# =============================================================================
# 18. 抽取提示
# =============================================================================
extraction_hints:

  rounding:
    rule: "保留原文精度，不四舍五入；说明书与论文精度不同，不得统一（如 −10.1 与 −10.09）"
    exceptions: "仅在换算单位（如 h → 天）时标注「换算值」"

  units:
    weight_change: "%（相对基线百分比变化）"
    weight_loss_threshold: "%（达到该降幅的受试者比例）"
    hba1c: "%（绝对值，非相对变化）"
    hba1c_change: "百分点或 %（沿用原文）"
    waist: "cm"
    bp: "mmHg"
    uric_acid: "μmol/L"

  ambiguity_traps:
    - "「体重下降 X%」与「X% 的受试者体重下降 ≥Y%」是两类指标，不可互换"
    - "「HbA1c 降低 2.03%」是绝对值下降，不是相对降幅"
    - "说明书「与安慰剂相比的差异」是组间差，不是试验组自身变化"
    - "GLORY-1 与 GLORY-2 剂量不同（4/6 mg vs 9 mg），不可直接比高低"
    - "DREAMS-2 对照组是度拉糖肽，不是司美格鲁肽"

  citation_format:
    efficacy: "数值 + 双方括号 fact id + 来源简称与年份"
    regulation: "（法规简称 §条款）"
    guideline: "（文件全称 文号）"

  hard_stops:
    - "输出中出现 DREAMS-3 数据但未标注「未经同行评审」→ 停止"
    - "输出中出现任何药品间疗效对比 → 停止"
    - "输出中出现「指南推荐玛仕度肽」→ 停止"
    - "输出中引用 D2 的 118.9% → 停止"
    - "输出面向公众且含商品名 + 疗效 → 停止"
