# 10. 法规与行业规范（条款级）
# =============================================================================
regulations:

  advertising_law:
    id: reg.adlaw
    title: "中华人民共和国广告法"
    version: "2021-04-29 修正"
    url: "https://www.gov.cn/guoqing/2021-10/29/content_5647620.htm"
    evidence: E4_OFFICIAL
    status: verified
    articles:
      - id: reg.adlaw.15
        no: "第十五条"
        topic: "处方药广告渠道限制"
        quote: |
          麻醉药品、精神药品、医疗用毒性药品、放射性药品等特殊药品，药品类易制毒化学品，以及戒毒治疗的药品、医疗器械和治疗方法，不得作广告。
          前款规定以外的处方药，只能在国务院卫生行政部门和国务院药品监督管理部门共同指定的医学、药学专业刊物上作广告。
      - id: reg.adlaw.16
        no: "第十六条"
        topic: "药品广告禁止内容"
        quote: |
          医疗、药品、医疗器械广告不得含有下列内容：
          （一）表示功效、安全性的断言或者保证；
          （二）说明治愈率或者有效率；
          （三）与其他药品、医疗器械的功效和安全性或者其他医疗机构比较；
          （四）利用广告代言人作推荐、证明；
          （五）法律、行政法规规定禁止的其他内容。
          药品广告的内容不得与国务院药品监督管理部门批准的说明书不一致，并应当显著标明禁忌、不良反应。
      - id: reg.adlaw.17
        no: "第十七条"
        topic: "非医疗广告不得涉疾病治疗功能"
        quote: |
          除医疗、药品、医疗器械广告外，禁止其他任何广告涉及疾病治疗功能，并不得使用医疗用语或者易使推销的商品与药品、医疗器械相混淆的用语。
      - id: reg.adlaw.19
        no: "第十九条"
        topic: "禁止变相发布广告"
        quote: |
          广播电台、电视台、报刊音像出版单位、互联网信息服务提供者不得以介绍健康、养生知识等形式变相发布医疗、药品、医疗器械、保健食品广告。
      - id: reg.adlaw.9
        no: "第九条"
        topic: "绝对化用语等通用禁止情形"
        quote: |
          广告不得有下列情形：……（二）使用或者变相使用国家机关、国家机关工作人员的名义或者形象；（三）使用「国家级」、「最高级」、「最佳」等用语；……

  drug_administration_law:
    id: reg.druglaw
    title: "中华人民共和国药品管理法"
    version: "2019-08-26 修订，2019-12-01 施行（主席令第三十一号）"
    evidence: E4_OFFICIAL
    status: verified
    articles:
      - id: reg.druglaw.88
        no: "第八十八条"
        topic: "禁止回扣与其他不正当利益"
        quote: |
          禁止药品上市许可持有人、药品生产企业、药品经营企业和医疗机构在药品购销中给予、收受回扣或者其他不正当利益。
          禁止药品上市许可持有人、药品生产企业、药品经营企业或者代理人以任何名义给予使用其药品的医疗机构的负责人、药品采购人员、医师、药师等有关人员财物或者其他不正当利益。
          禁止医疗机构的负责人、药品采购人员、医师、药师等有关人员以任何名义收受……财物或者其他不正当利益。
      - id: reg.druglaw.89
        no: "第八十九条"
        topic: "药品广告须经审查批准"
        quote: |
          药品广告应当经广告主所在地省、自治区、直辖市人民政府确定的广告审查机关批准；未经批准的，不得发布。
      - id: reg.druglaw.90
        no: "第九十条"
        topic: "广告内容以说明书为准；禁止借名义推荐"
        quote: |
          药品广告的内容应当真实、合法，以国务院药品监督管理部门核准的药品说明书为准，不得含有虚假的内容。
          药品广告不得含有表示功效、安全性的断言或者保证；不得利用国家机关、科研单位、学术机构、行业协会或者专家、学者、医师、药师、患者等的名义或者形象作推荐、证明。
          非药品广告不得有涉及药品的宣传。
      - id: reg.druglaw.91
        no: "第九十一条"
        topic: "转致条款"
        quote: |
          药品价格和广告，本法未作规定的，适用《中华人民共和国价格法》、《中华人民共和国反垄断法》、《中华人民共和国反不正当竞争法》、《中华人民共和国广告法》等的规定。

  anti_unfair_competition:
    id: reg.afl
    title: "中华人民共和国反不正当竞争法"
    version: "2025-06-27 第二次修订，2025-10-15 施行（主席令第五十号），条文由 33 条增至 41 条"
    urls:
      law: "http://npc.gov.cn/c2/c30834/202506/t20250627_446247.html"
      order: "http://www.npc.gov.cn/c2/kgfb/202506/t20250627_446260.html"
    evidence: E4_OFFICIAL
    status: verified
    version_warning: "商业贿赂条款已由旧法第七条移至新法第八条；引用旧条款号即为错误，见 D9"
    articles:
      - id: reg.afl.8
        no: "第八条"
        topic: "商业贿赂"
        quote: |
          经营者不得采用给予财物或者其他手段贿赂下列单位或者个人，以谋取交易机会或者竞争优势：
          （一）交易相对方的工作人员；
          （二）受交易相对方委托办理相关事务的单位或者个人；
          （三）利用职权或者影响力影响交易的单位或者个人。
          前款规定的单位和个人不得收受贿赂。
          经营者在交易活动中，可以以明示方式向交易相对方支付折扣，或者向中间人支付佣金。……应当如实入账。
          经营者的工作人员进行贿赂的，应当认定为经营者的行为；但是，经营者有证据证明该工作人员的行为与为经营者谋取交易机会或者竞争优势无关的除外。
      - id: reg.afl.8.penalty
        no: "第十九条（处罚）"
        topic: "商业贿赂罚则"
        quote: "没收违法所得，处十万元以上三百万元以下罚款；情节严重的，吊销营业执照。"
      - id: reg.afl.9
        no: "第九条"
        topic: "虚假或引人误解的商业宣传"
        quote: |
          经营者不得对其商品的性能、功能、质量、销售状况、用户评价、曾获荣誉等作虚假或者引人误解的商业宣传，欺骗、误导消费者和其他经营者。
          经营者不得通过组织虚假交易、虚假评价等方式，帮助其他经营者进行虚假或者引人误解的商业宣传。

  ad_review_rule_21:
    id: reg.samr21
    title: "药品、医疗器械、保健食品、特殊医学用途配方食品广告审查管理暂行办法"
    issuer: "国家市场监督管理总局"
    document_number: "国家市场监督管理总局令第 21 号"
    published: "2019-12-24 公布"
    effective: "2020-03-01 施行"
    url: "https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_4ca076ac0eeb4a9e9204e0cee26e359b.html"
    evidence: E4_OFFICIAL
    status: verified
    articles:
      - {id: reg.samr21.2,  no: "第二条", topic: "未经审查不得发布", quote: "未经审查不得发布药品、医疗器械、保健食品和特殊医学用途配方食品广告。"}
      - id: reg.samr21.5
        no: "第五条"
        topic: "广告以说明书为准（最核心推广边界）"
        quote: |
          药品广告的内容应当以国务院药品监督管理部门核准的说明书为准。药品广告涉及药品名称、药品适应症或者功能主治、药理作用等内容的，不得超出说明书范围。
          药品广告应当显著标明禁忌、不良反应，处方药广告还应当显著标明「本广告仅供医学药学专业人士阅读」……
      - {id: reg.samr21.9,  no: "第九条", topic: "须标明广告批准文号", quote: "药品、医疗器械、保健食品和特殊医学用途配方食品广告应当显著标明广告批准文号。"}
      - id: reg.samr21.11
        no: "第十一条"
        topic: "八类禁止情形"
        quote: |
          不得违反《中华人民共和国广告法》第九条、第十六条、第十七条、第十八条、第十九条规定，不得包含下列情形：
          （一）使用或者变相使用国家机关、国家机关工作人员、军队单位或者军队人员的名义或者形象……
          （二）使用科研单位、学术机构、行业协会或者专家、学者、医师、药师、临床营养师、患者等的名义或者形象作推荐、证明；
          （三）违反科学规律，明示或者暗示可以治疗所有疾病、适应所有症状、适应所有人群……
          （四）引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧……
          （五）含有「安全」「安全无毒副作用」「毒副作用小」；明示或者暗示成分为「天然」，因而安全性有保证等内容；
          （六）含有「热销、抢购、试用」「家庭必备、免费治疗、免费赠送」等诱导性内容，「评比、排序、推荐、指定、选用、获奖」等综合性评价内容，「无效退款、保险公司保险」等保证性内容……
          （七）含有医疗机构的名称、地址、联系方式、诊疗项目、诊疗方法以及有关义诊、医疗咨询电话……
          （八）法律、行政法规规定不得含有的其他内容。
      - {id: reg.samr21.20, no: "第二十条", topic: "不得擅自剪辑修改", quote: "广告主、广告经营者、广告发布者应当严格按照审查通过的内容发布……不得进行剪辑、拼接、修改。已经审查通过的广告内容需要改动的，应当重新申请广告审查。"}
      - id: reg.samr21.22
        no: "第二十二条"
        topic: "处方药仅限专业刊物"
        quote: |
          本办法第二十一条规定以外的处方药和特殊医学用途配方食品中的特定全营养配方食品广告只能在国务院卫生行政部门和国务院药品监督管理部门共同指定的医学、药学专业刊物上发布。……不得使用与处方药名称……相同的商标、企业字号在医学、药学专业刊物以外的媒介变相发布广告，也不得利用该商标、企业字号为各种活动冠名进行广告宣传。
      - id: reg.samr21.34
        no: "第三十四条"
        topic: "旧规章废止"
        quote: |
          本办法自 2020 年 3 月 1 日起施行。……2007 年 3 月 3 日原国家工商行政管理总局、原国家食品药品监督管理局令第 27 号公布的《药品广告审查发布标准》，2007 年 3 月 13 日原国家食品药品监督管理局、原国家工商行政管理总局令第 27 号发布的《药品广告审查办法》……同时废止。

  medical_ad_rule:
    id: reg.medicalad
    title: "医疗广告管理办法"
    issuer: "国家工商行政管理总局、卫生部"
    document_number: "国家工商行政管理总局、卫生部令第 26 号"
    published: "2006-11-10 公布"
    effective: "2007-01-01 施行"
    evidence: E4_OFFICIAL
    status: partial
    status_note: "文号与条款已核对；未查到市场监管总局规章库现行有效性标记。2025–2026 年地方卫健执法仍引用第 26 号令，可推定有效，标注「现行有效」前建议再核一次"
    articles:
      - {id: reg.medicalad.3, no: "第三条", topic: "须取得审查证明", quote: "医疗机构发布医疗广告，应当在发布前申请医疗广告审查。未取得《医疗广告审查证明》，不得发布医疗广告。发布医疗广告的有效期为一年，并严格按照核定内容进行广告宣传。"}
      - id: reg.medicalad.6
        no: "第六条"
        topic: "内容仅限八项"
        quote: "医疗广告内容仅限于以下项目：（一）医疗机构第一名称；（二）医疗机构地址；（三）所有制形式；（四）医疗机构类别；（五）诊疗科目；（六）床位数；（七）接诊时间；（八）联系电话。"
      - id: reg.medicalad.7
        no: "第七条"
        topic: "表现形式禁止"
        quote: "医疗广告的表现形式不得含有以下情形：（一）涉及医疗技术、诊疗方法、疾病名称、药物的；（二）保证治愈或者隐含保证治愈的；（三）宣传治愈率、有效率等诊疗效果的；……"

  medical_rep_rule:
    id: reg.rep
    title: "医药代表备案管理办法（试行）"
    issuer: "国家药品监督管理局"
    document_number: "国家药监局公告 2020 年第 105 号"
    published: "2020-09-22"
    effective: "2020-12-01 施行"
    url: "https://www.nmpa.gov.cn/directory/web/nmpa/images/1601455275449085290.doc"
    register_platform: "https://pharmareps.cpa.org.cn（中国药学会维护）"
    evidence: E4_OFFICIAL
    status: verified
    articles:
      - id: reg.rep.2
        no: "第二条"
        topic: "医药代表定义与四项任务"
        quote: |
          本办法所称医药代表，是指代表药品上市许可持有人在中华人民共和国境内从事药品信息传递、沟通、反馈的专业人员。
          医药代表主要工作任务：（一）拟订医药产品推广计划和方案；（二）向医务人员传递医药产品相关信息；（三）协助医务人员合理使用本企业医药产品；（四）收集、反馈药品临床使用情况及医院需求信息。
      - id: reg.rep.3
        no: "第三条"
        topic: "允许的五种学术推广形式"
        quote: |
          （一）在医疗机构当面与医务人员和药事人员沟通；（二）举办学术会议、讲座；（三）提供学术资料；（四）通过互联网或者电话会议沟通；（五）医疗机构同意的其他形式。
      - id: reg.rep.13
        no: "第十三条"
        topic: "七类禁止行为（合规规则骨架）"
        quote: |
          医药代表不得有下列情形：
          （一）未经备案开展学术推广等活动；
          （二）未经医疗机构同意开展学术推广等活动；
          （三）承担药品销售任务，实施收款和处理购销票据等销售行为；
          （四）参与统计医生个人开具的药品处方数量；
          （五）对医疗机构内设部门和个人直接提供捐赠、资助、赞助；
          （六）误导医生使用药品，夸大或者误导疗效，隐匿药品已知的不良反应信息或者隐瞒医生反馈的不良反应信息；
          （七）其他干预或者影响临床合理用药的行为。
      - {id: reg.rep.14, no: "第十四条", topic: "行贿转致", quote: "药品上市许可持有人或者医药代表给予使用其药品的有关人员财物或者其他不正当利益的，依照《中华人民共和国药品管理法》《中华人民共和国反不正当竞争法》等相关法律法规进行调查处理。"}
      - {id: reg.rep.15, no: "第十五条", topic: "医疗机构侧义务", quote: "医疗机构不得允许未经备案的人员对本医疗机构医务人员或者药事人员开展学术推广等相关活动；医疗机构可在备案平台查验核对医药代表备案信息。"}

  rdpac:
    id: reg.rdpac
    title: "RDPAC 行业行为准则"
    issuer: "中国外商投资企业协会药品研制和开发行业委员会（RDPAC）"
    version: "2022 年修订版（第七版），2022-09-30 经 45 家会员公司投票批准"
    effective: "2023-04-01"
    nature: "行业自律规范，对会员公司有强制约束力；非会员企业常自愿参照"
    evidence: E4_OFFICIAL
    status: partial
    status_note: "第一至七章条文已核对；第八至十四章仅核对目录结构与公开摘录，未逐条比对官方 PDF 全文"
    articles:
      - id: reg.rdpac.1
        no: "第一条 1.1"
        topic: "适用范围"
        quote: |
          RDPAC 准则的规范对象是会员公司与医疗卫生专业人士、医疗卫生组织、患者组织和患者之间的医学互动交流，以及药品的推广活动。……适用于所有会员公司的雇员，以及代表会员公司执行工作任务的分包商。
      - id: reg.rdpac.3
        no: "第三条"
        topic: "未获批前不得推广 / 超说明书交流边界"
        quote: |
          会员公司在其药品获得中国药品主管部门颁发的上市（生产或进口）许可之前，不得从事为在中国上市使用该药品而进行的推广活动。……会员公司在药品获得上市许可前，或就药品说明书之外的信息与医疗卫生专业人士的互动交流，无论以口头或书面形式进行，均应由会员公司医学专业人员进行或在医学专业人员的监督下进行。
      - id: reg.rdpac.4
        no: "第四条"
        topic: "推广信息标准（三段式）"
        quote: |
          4.1 药品信息的一致性：药品信息推广应与中国药品主管部门批准的药品信息相一致。
          4.2 准确和不误导：推广信息应当清楚、易理解、准确、客观、公正、和高度完整……一般应避免使用诸如「安全」、「无副作用」之类的描述性用语，如需使用也须有充分的科学论证。
          4.3 实证：药品推广信息应能通过对已经批准的药品说明书或科学证据的引用而得到证实。
      - id: reg.rdpac.5
        no: "第五条"
        topic: "印刷材料五项必备内容"
        quote: "（a）药品名称；（b）药物活性成份；（c）制药公司或药品代理公司的名称及地址；（d）推广材料制作的日期；（e）处方信息概要，包括已经批准的一项或多项适应症、用法用量，以及对禁忌症提示和副作用的简要说明。"
      - id: reg.rdpac.6
        no: "第六条"
        topic: "电子推广材料同等要求"
        quote: "电子版推广材料应遵守与印刷形式推广材料相同的各项要求。……（d）针对中国市场的信息应符合中国法律法规的各项规定。"
      - id: reg.rdpac.7
        no: "第七条"
        topic: "与医疗卫生专业人士互动"
        quote: |
          7.1.3 适当的地点/住宿：医学互动交流项目举办的地点应适当……应避免选择名胜或铺张奢侈的地点（注释 13：避免 SPA、温泉、度假酒店、滑雪、高尔夫、赌博、邮轮等）。
          7.1.4 限制附属于医学互动交流项目的招待：……用于招待的支出按当地标准应当是中等适度和合理的……招待应限于：（1）场地和住宿，（2）交通，（3）餐饮和小食。
          7.6.1 禁止提供礼品。
          7.3 服务费 / 7.4 讲者项目：讲者须具备相应专业资格，服务费须与真实、可验证的服务相匹配，不得与处方量挂钩。

# =============================================================================
# 11. 合规规则（法条 → 规则映射）
# =============================================================================
compliance_rules:
  - id: rule.R1
    rule: "一切对外传播内容不得超出核准说明书范围（适应症、人群、疗效、安全性口径）"
    legal_basis: ["广告法§16Ⅱ", "药品管理法§90Ⅰ", "21号令§5", "RDPAC§4.1/§4.3"]
    check: "逐句比对 label.indications 与 label.efficacy；出现说明书未载明的适应症/人群/数值即违规"
  - id: rule.R2
    rule: "处方药不得面向公众做广告或变相广告（社媒、直播、搜索、科普软文、患者故事均属）"
    legal_basis: ["广告法§15Ⅱ", "广告法§19", "21号令§22"]
    check: "受众是否为公众；是否出现商品名+疗效/用法指向"
  - id: rule.R3
    rule: "不得出现功效/安全性断言（不反弹、无副作用、最安全），不得给治愈率/有效率，不得与竞品比较功效安全性"
    legal_basis: ["广告法§16Ⅰ(一)(二)(三)", "21号令§11(三)(五)", "RDPAC§4.2"]
  - id: rule.R4
    rule: "不得借专家、学会、医生、患者名义或形象作推荐证明"
    legal_basis: ["广告法§16Ⅰ(四)", "药品管理法§90Ⅱ", "21号令§11(二)"]
  - id: rule.R5
    rule: "推广材料须载明五项必备内容；电子材料同等要求；广告须标批准文号"
    legal_basis: ["RDPAC§5", "RDPAC§6", "21号令§9"]
  - id: rule.R6
    rule: "不得以讲课费/咨询费/赞助/捐赠等形式给予不正当利益；不得与处方量挂钩；不得统方"
    legal_basis: ["药品管理法§88", "反不正当竞争法§8、§19", "医药代表办法§13(三)(四)(五)、§14"]
  - id: rule.R7
    rule: "医药代表须备案、须经医疗机构同意方可开展活动；不得承担销售任务"
    legal_basis: ["医药代表办法§3、§13(一)(二)、§15"]
  - id: rule.R8
    rule: "未获批适应症/未获批人群不得推广；超说明书交流须由医学专业人员实施并留痕"
    legal_basis: ["RDPAC§3", "广告法§16Ⅱ", "21号令§5"]
  - id: rule.R9
    rule: "学术会议地点与招待标准须适度，禁礼品、禁旅游性支出"
    legal_basis: ["RDPAC§7.1.3、§7.1.4、§7.6.1"]
  - id: rule.R10
    rule: "不得使用「国家级」「最高级」「最佳」等绝对化用语；不得贬低竞品"
    legal_basis: ["广告法§9(三)、§13", "21号令§11(六)"]

# =============================================================================
# 12. 表述政策（白名单 / 黑名单 / 需加限定）
# =============================================================================
claims_policy:

  allowed:
    id: claim.allowed
    evidence: E1_LABEL
    examples:
      - claim: "本品适用于 BMI ≥28，或 BMI ≥24 且伴至少一种体重相关合并症的成人长期体重控制，需配合控制饮食与增加体力活动"
        fact: label.indication.weight
      - claim: "GLORY-1 中，4 mg 组第 32 周体重较基线下降 10.1%，6 mg 组下降 12.5%，安慰剂组上升 0.5%（mITT，多重填补）"
        facts: [efficacy.glory1.w32.pct]
      - claim: "最常见不良反应为恶心、腹泻、呕吐，多为轻中度，集中在剂量递增阶段"
        facts: [safety.ae.weight.nausea, safety.gi.glory1]
      - claim: "禁用于有甲状腺髓样癌个人或家族史者及 MEN 2 患者"
        fact: label.contraindication
      - claim: "推荐起始剂量 2 mg 每周一次，4 周后增至 4 mg，必要时可增至 6 mg"
        facts: [dose.start, dose.titration]
    constraint: "每条 claim 必须绑定 fact id；数值必须带单位"

  forbidden:
    id: claim.forbidden
    evidence: E4_OFFICIAL
    items:
      - pattern: "减重不反弹 / 停药不反弹"
        reason: "功效断言，无说明书依据（广告法§16Ⅰ(一)）"
      - pattern: "无副作用 / 安全无毒副作用 / 最安全"
        reason: "广告法§16Ⅰ(一)；21号令§11(五) 明文列举"
      - pattern: "治愈肥胖 / 治愈糖尿病 / 根治"
        reason: "广告法§16Ⅰ(二)；本品为长期体重控制与血糖控制，非治愈"
      - pattern: "优于司美格鲁肽 / 优于替尔泊肽 / 效果最好"
        reason: "无头对头试验；广告法§16Ⅰ(三) 禁止与同类药品比较功效安全性"
      - pattern: "指南推荐玛仕度肽 / 国内外指南一线推荐"
        reason: "2024 版肥胖指南成文于获批前，见 D11"
      - pattern: "1 针瘦 X 斤 / X 天见效 / 快速减重"
        reason: "效果承诺，且与说明书滴定方案矛盾"
      - pattern: "适合所有人 / 无门槛减重 / 谁都能用"
        reason: "21号令§11(三) 适应所有人群"
      - pattern: "减肥针 / 网红减肥药 / 躺着瘦"
        reason: "属以公众为对象的变相广告（广告法§15Ⅱ、§19）"
      - pattern: "可替代饮食控制和运动"
        reason: "说明书适应症以「在控制饮食和增加体力活动基础上」为前提"
      - pattern: "可治疗脂肪肝 / 可治痛风 / 可降压"
        reason: "说明书仅载代谢指标改善，未批准治疗这些疾病"
      - pattern: "（用 DREAMS-3 数字时）研究已发表 / 文献证实"
        reason: "无同行评审论文，见 D4"
      - pattern: "（把减重版用于 T2DM 患者或反之）两适应症通用"
        reason: "两版说明书适应症、禁忌、AE 表独立，见 D1"

  requires_qualifier:
    id: claim.qualified
    items:
      - claim_type: "GLORY-1 减重数值"
        qualifier: "须注明口径：说明书为 mITT 多重填补；NEJM 为 treatment-policy。两者不可混用（D7）"
      - claim_type: "DREAMS-3 全部疗效数据"
        qualifier: "须注明「申办方公布的 ADA 2026 口头报告结果，尚未经同行评审发表」"
      - claim_type: "GLORY-2 人群描述"
        qualifier: "须写「BMI ≥30 的中重度肥胖成人（16.1% 合并 T2DM）」，不得写作「T2DM 合并肥胖」"
      - claim_type: "GLORY-1 ≥10% 达标率与腰围数据"
        qualifier: "须注明来自申办方新闻稿，未经期刊原文核对"
      - claim_type: "DREAMS-1/2 达标率"
        qualifier: "说明书有绝对值，Nature 摘要无；引用摘要时不得补入说明书数值"
      - claim_type: "不良反应发生率"
        qualifier: "须注明来自 GLORY-1 或 DREAMS-1/2，且不得跨试验比较"
      - claim_type: "指南引用"
        qualifier: "须带文号与发布日期；学会指南不得写成政府文件"

# =============================================================================
# 13. 冲突与存疑（下游必须读，禁止自行消解）
# =============================================================================
discrepancies:

  - id: D1
    severity: high
    topic: "官方 PDF 内含两张独立说明书"
    detail: "减重版核准 2025-06-24，T2DM 版核准 2025-09-16；适应症、禁忌、不良反应表、临床试验数据均不同"
    handling: "引用前先确定受众/适应症，全程只用对应版本；不得跨版本拼数据"
    source: "label.md 头部说明"

  - id: D2
    severity: high
    topic: "T2DM 版表 6 度拉糖肽组双达标率印为 118.9%"
    detail: "数值上不可能（应约 18.9%）；本库保留原文并加 ※ 标记"
    handling: "引用前核对纸质原件；在核对完成前不得引用该单元格"
    source: "label.md 表 6"

  - id: D3
    severity: high
    topic: "GLORY-2 人群与常见描述不符"
    detail: "实际为 BMI ≥30 的中重度肥胖中国成人（16.1% 合并 T2DM），非「T2DM 合并超重/肥胖」；后者对应 DREAMS-3"
    handling: "任何提及 GLORY-2 的文本必须使用正确人群描述"

  - id: D4
    severity: high
    topic: "DREAMS-3 无同行评审结果论文"
    detail: "仅有设计论文（Contemp Clin Trials 2026;160:108150）+ ADA 2026 口头报告 1226-OR + 申办方新闻稿；截至 2026-10-25 检索无结果论文"
    handling: "只能作为「申办方公布数据」引用，不得称「研究显示/文献表明」"

  - id: D5
    severity: medium
    topic: "DREAMS-1 样本量 320 vs 319"
    detail: "论文/注册随机 320 例，注册实际入组 319 例，说明书表述 319 例"
    handling: "引用说明书口径写 319；引用论文时写 320 随机"

  - id: D6
    severity: medium
    topic: "DREAMS-3 样本量 349 vs 329"
    detail: "注册与设计论文为 349；申办方新闻稿为 329，推测为 efficacy estimand 人群但未明示"
    handling: "引用时并列注明两个数字及推测，不作断言"

  - id: D7
    severity: high
    topic: "同一试验两套统计口径"
    detail: |
      GLORY-1：说明书 mITT 多重填补 W32 −10.1/−12.5/+0.5、≥5% 73.9/82.0/10.5；
      NEJM treatment-policy W32 −10.09/−12.55/+0.45、≥5% 相同。
      DREAMS-1：说明书主表 −1.58/−2.02/−0.25，脚注 MMRM −1.57/−2.15/−0.14。
    handling: "同一文本内只用一套口径并注明；不得把两套数字并列做「范围」表述"

  - id: D8
    severity: medium
    topic: "DREAMS-2 盲态描述不一致"
    detail: "说明书写作「玛仕度肽剂量盲态、度拉糖肽对照（开放标签）」；ClinicalTrials.gov 登记为 double-masked；Nature 摘要称双盲"
    handling: "描述设计时优先用说明书表述并注明注册信息差异；不得断言为「双盲、双模拟」"
    status: unverified

  - id: D9
    severity: high
    topic: "反不正当竞争法条款号已变更"
    detail: "2025-10-15 起施行的新法把商业贿赂从第七条移至第八条，罚则见第十九条"
    handling: "一律引用新法条款号；引用网络旧文（第七条）即为错误"

  - id: D10
    severity: medium
    topic: "《医疗广告管理办法》现行有效性未完全确认"
    detail: "未查到市场监管总局规章库有效性标记；地方执法仍引用第 26 号令"
    handling: "可引用条款内容；标注「现行有效」前需复核"

  - id: D11
    severity: high
    topic: "2024 版肥胖指南不含玛仕度肽"
    detail: "指南发布 2024-10-12，本品 2025-06-24 获批"
    handling: "禁止「指南推荐玛仕度肽」类表述；指南只能用于支撑问诊逻辑与诊断标准"

  - id: D12
    severity: medium
    topic: "GLORY-2 多个登记次要终点无数值"
    detail: "≥10%/≥15%/≥20%、腰围、SBP、TG、non-HDL-C、LDL-C 均未在 JAMA 摘要报告"
    handling: "不得推断、不得用其他试验数值替代"

  - id: D13
    severity: medium
    topic: "妊娠禁用写在【注意事项】而非【禁忌】"
    detail: "【禁忌】仅列过敏与 MTC/MEN 2；【注意事项】写「故本品禁用于妊娠期妇女」"
    handling: "表述为「说明书明确禁用于妊娠期妇女」，不要写成「【禁忌】项下」"

  - id: D14
    severity: low
    topic: "T2DM 版不良反应表未逐项抽取"
    detail: "本库只抽了减重版 AE 表；T2DM 版表需回读 label.md 第 574 行起"
    handling: "需要 T2DM AE 数值时必须回读原文，不得套用减重版数字"

  - id: D15
    severity: low
    topic: "RDPAC 第八至十四章未逐条核对"
    detail: "仅核对目录与公开摘录"
    handling: "引用这些章节原文前须下载 2022 修订版 PDF 核对"

  - id: D16
    severity: medium
    topic: "肥胖指南药物清单未逐字核对"
    detail: "媒体称列出奥利司他、利拉鲁肽、贝那鲁肽、司美格鲁肽、替尔泊肽五种"
    handling: "status=unverified，引用前回 PDF「药物治疗」章节"

