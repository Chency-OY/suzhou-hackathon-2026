- id: guide.obesity2024.modalities
  category: guide
  statement: 治疗手段构成；第六章；原文：「肥胖症治疗有多种手段，主要包括：行为心理干预、运动干预、临床营养治疗、药物治疗、外科手术治疗以及中医药治疗等。……一般建议所有患者均应接受营养、运动、心理指导作为全程基础管理。」
