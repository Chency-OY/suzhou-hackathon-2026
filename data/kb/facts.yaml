- id: label.indication.weight
  category: indication
  statement: '减重版（核准 2025-06-24）；用于在控制饮食和增加体力活动基础上对成人患者的长期体重控制；criteria：op：BMI ≥ 28 kg/m²；meaning：肥胖、op：BMI ≥ 24 kg/m²；meaning：超重，且须伴有至少一种体重相关合并症；comorbidities_listed：高血糖、高血压、血脂异常、脂肪肝、阻塞性睡眠呼吸暂停综合征；说明书以「例如……等」列举，非穷尽清单；原文：「本品适用于在控制饮食和增加体力活动基础上对成人患者的长期体重控制，初始体重指数（BMI）为：

    • BMI ≥28 kg/m²（肥胖），或

    • BMI ≥24 kg/m²（超重），并伴有至少一种体重相关的合并症（例如高血糖、高血压、血脂异常、脂肪肝、阻塞性睡眠呼吸暂停综合征等）。」'
  source: label.md#【适应症】
  source_url: ''
  verified: true
  caution: ''
- id: label.indication.t2dm
  category: indication
  statement: 'T2DM 版（核准 2025-09-16）；适用于成人 2 型糖尿病患者的血糖控制；monotherapy：value：单纯饮食控制和运动干预后血糖仍控制不佳的成人 2 型糖尿病患者；combination：value：在饮食控制和运动基础上，接受二甲双胍和/或磺脲类药物、接受二甲双胍和/或 SGLT2i 类药物治疗血糖仍控制不佳的成人 2 型糖尿病患者；T2DM 适应症未设 BMI 门槛；原文：「本品适用于成人2 型糖尿病患者的血糖控制：

    单药治疗 单纯饮食控制和运动干预后血糖仍控制不佳的成人2 型糖尿病患者；

    联合治疗 在饮食控制和运动基础上，接受二甲双胍和/或磺脲类药物、接受二甲双胍和/或钠-葡萄糖共转运蛋白2 抑制剂（SGLT2i）类药物治疗血糖仍控制不佳的成人2 型糖尿病患者。」'
  source: label.md#【适应症】
  source_url: ''
  verified: true
  caution: T2DM 适应症未设 BMI 门槛
