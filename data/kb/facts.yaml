- id: dose.route
  category: dosing
  statement: 皮下注射，每周一次；detail：可在一天中任意时间注射，无需根据进餐时间给药、可在腹部皮下注射；不可静脉或肌肉注射、首次使用前由医护专业人员提供皮下注射技术指导，此后患者可自行注射或由护理人员注射、可改变每周给药日期，但两剂间隔须至少 5 天（> 120 小时）
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.start
  category: dosing
  statement: 2 mg；mg；T2DM 版明确「2 mg 的剂量目的是起始治疗而非控制血糖」
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.maintenance
  category: dosing
  statement: 4、6；mg；推荐维持剂量 4 mg 或 6 mg；如 6 mg 不耐受可回调至 4 mg
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: 推荐维持剂量 4 mg 或 6 mg；如 6 mg 不耐受可回调至 4 mg
- id: dose.titration
  category: dosing
  statement: weeks：1–4；dose_mg：2；type：滴定剂量、weeks：5–8；dose_mg：4；type：滴定剂量、weeks：≥9；dose_mg：4；type：维持剂量（或 6 mg）；每档至少 4 周后方可递增；增至 6 mg 需在当前剂量治疗至少 4 周
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: 每档至少 4 周后方可递增；增至 6 mg 需在当前剂量治疗至少 4 周
- id: dose.missed
  category: dosing
  statement: gap：≤2 天（距上次给药 ≤9 天）；action：尽快给药，下一剂按原计划日期、gap：2–7 天（距上次给药 9–14 天）；action：尽快给药，并重新计算每周给药日期、gap：7–21 天（距上次给药 14–28 天）；action：下调至前 1 个剂量，重新开始滴定、gap：>21 天（距上次给药 >28 天）；action：下调至起始剂量，按表 1 重新滴定
