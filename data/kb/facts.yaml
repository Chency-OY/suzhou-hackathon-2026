- id: guide.obesity2024.bmi_cutoff
  category: guide
  statement: BMI 诊断切点；第四章 肥胖症的定义、诊断标准、分型、分期及相关疾病；原文：「在我国成年人群中，BMI 低于 18.5 kg/m² 为低体重状态，达到 18.5 kg/m² 且低于 24 kg/m² 为正常体重，达到 24 kg/m² 且低于 28 kg/m² 为超重，达到或超过 28 kg/m² 为肥胖症。」
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
