- id: guide.obesity2024.waist
  category: guide
  statement: 中心性肥胖腰围切点；同上，基于体型特征的诊断标准；原文：「正常腰围定义为 <85 cm（男性）和 <80 cm（女性），腰围 ≥90 cm（男性）和 ≥85 cm（女性）即可诊断为中心性肥胖。……当 WHR ≥0.90（男性）和 ≥0.85（女性）时，也可诊断为中心性肥胖。」
