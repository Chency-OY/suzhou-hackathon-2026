- id: guide.weight2024.scope
  category: guide
  statement: 文件定位与内容框架；原文：「为进一步落实《「体重管理年」活动实施方案》，强化慢性病防治关口前移……我委委托国家心血管病中心牵头，组织相关领域专家，针对超重肥胖等体重问题的规范化管理制定了《体重管理指导原则（2024年版）》。主要内容包括体重的分类标准、体重管理相关评估、超重肥胖的干预和治疗、健康体重的管理与维持、特殊人群的体重管理、规范化体重管理流程等，供各地推广使用。」
