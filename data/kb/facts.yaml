- id: dose.t2dm.combo
  category: dosing
  statement: 在二甲双胍基础上加用本品时，可继续二甲双胍当前剂量、与磺脲类联合时应考虑减少磺脲类剂量，以降低低血糖风险
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.hepatic
  category: dosing
  statement: 轻度肝功能不全无需调整剂量；轻度定义：TBIL ≤ULN 且 AST >ULN，或 TBIL >1～1.5×ULN 且任意 AST；中度、重度无数据
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.renal
  category: dosing
  statement: 轻、中、重度肾功能不全均无需调整剂量；轻度 GFR 60–89、中度 30–59、重度 15–29 ml/min；中重度用药经验有限，应谨慎；终末期肾病无数据
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.elderly
  category: dosing
  statement: 65 岁及以上患者有限（减重 III 期试验中 N=3），尚无法确定安全性与有效性
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.pediatric
  category: dosing
  statement: 18 岁以下安全性与有效性尚未确定
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.pregnancy
  category: dosing
  statement: 禁用于妊娠期妇女；计划妊娠前应停用玛仕度肽至少 3 个月（因半衰期较长）；治疗期间建议有生育能力女性避孕
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: dose.interactions
  category: dosing
  statement: drug：胰岛素 / 胰岛素促泌剂（如磺脲类）；effect：联用增加低血糖风险，起始本品时应考虑减量；evidence：E1_LABEL、drug：口服药物（一般）；effect：GLP-1 类延缓胃排空，可能影响伴随口服药吸收；治疗窗窄药物（如华法林）需密切监测；evidence：E1_LABEL、drug：阿托伐他汀；effect：AUCinf +22.5%，Cmax −22.8%；evidence：E1_LABEL、drug：地高辛；effect：AUCinf +12.5%，Cmax −35.2%；evidence：E1_LABEL、drug：二甲双胍；effect：AUCinf −15.6%，Cmax −43.6%；evidence：E1_LABEL、drug：华法林；effect：AUCinf +11.4%，Cmax +2.3%；evidence：E1_LABEL；预期上述变化不会产生具有临床意义的影响
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: true
  caution: ''
- id: dose.overdose
  category: dosing
  statement: 无用药过量临床数据；参照其他 GLP-1 类药物，过量可致重度恶心、呕吐、低血糖；因半衰期长，症状可能需长时间观察或治疗
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: label.contraindication
  category: safety
  statement: 已知对本品活性成份或任何辅料过敏者、甲状腺髓样癌（MTC）个人既往病史或家族病史、2 型多发性内分泌肿瘤综合征（MEN 2）患者；妊娠期禁用写在【注意事项】而非【禁忌】项下，见 discrepancies D13；原文：「已知对本品活性成份或本品中任何辅料过敏者。甲状腺髓样癌（MTC）个人既往病史或家族病史，或2 型多发性内分泌肿瘤综合征患者（MEN 2）（见【注意事项】）。」
  source: label.md#【禁忌】（两版一致）
  source_url: ''
  verified: true
  caution: 妊娠期禁用写在【注意事项】而非【禁忌】项下，见 discrepancies D13
- id: label.warning.mtc
  category: safety
  statement: 警告：甲状腺 C 细胞肿瘤风险；啮齿类动物在临床相关暴露水平下可出现甲状腺 C 细胞肿瘤、尚不清楚是否引起人类甲状腺 C 细胞肿瘤（含 MTC），因动物与人类相关性未确定、禁用于有 MTC 既往史/家族史及 MEN 2 患者；应告知患者可能的 MTC 风险及甲状腺肿瘤症状；symptoms_to_teach：颈部肿块、吞咽困难、呼吸困难、持续性声音嘶哑；MTC 患者降钙素通常 >50 ng/L；常规筛查降钙素或超声的价值尚不明确
  source: 上游事实库[E1_LABEL]
  source_url: ''
  verified: true
  caution: ''
- id: label.warning.anesthesia
  category: safety
  statement: 全身麻醉或深度镇静相关误吸；GLP-1 受体激动剂有麻醉/深度镇静时肺误吸报道；术前应考虑胃排空延迟导致的内容物残留风险
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
  caution: ''
- id: label.warning.pancreatitis
  category: safety
  statement: 急性胰腺炎；III 期试验中玛仕度肽组 1 例（胆结石所致阻塞性、轻症，Atlanta 分级）；安慰剂组 0 例；怀疑胰腺炎应停药并治疗
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
  caution: ''
- id: label.warning.gallbladder
  category: safety
  statement: 急性胆囊疾病；III 期试验胆石症 2.0% vs 安慰剂 1.0%；胆囊炎 1.0% vs 1.5%；急性胆囊疾病患者不推荐使用
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
  caution: ''
- id: label.warning.hr
  category: safety
  statement: 心率增加；应常规监测心率；静息心率持续增加则停药
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
  caution: ''
- id: label.warning.hypersensitivity
  category: safety
  statement: 过敏反应；III 期试验过敏反应 3.5% vs 安慰剂 1.5%，无严重过敏反应
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
  caution: ''
- id: label.warning.aki
  category: safety
  statement: 急性肾损伤；III 期试验无报告；胃肠道反应可致脱水继而 AKI；起始与剂量递增时应监测肾功能
  source: 上游事实库 facts_upstream.yaml
  source_url: ''
  verified: false
  caution: ''
