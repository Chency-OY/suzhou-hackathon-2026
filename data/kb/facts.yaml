- id: guide.obesity2024.target
  category: guide
  statement: 减重目标分层；第六章 肥胖症的治疗原则；原文：「对于大多数超重和轻度肥胖症患者，可设定为在 3-6 个月之内至少将体重降低 5%-15% 并维持；对于中、重度肥胖症患者则可设定更高的减重目标……建议每 3-6 个月对减重效果和代谢指标进行评估。」
