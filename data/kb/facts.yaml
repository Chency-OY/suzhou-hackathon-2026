- id: guide.obesity2024.grading
  category: guide
  statement: 肥胖症四级分级；同上；原文：「建议 BMI 达到 28.0 kg/m² 且低于 32.5 kg/m² 为轻度肥胖症、达到 32.5 kg/m² 且低于 37.5 kg/m² 为中度肥胖症、达到 37.5 kg/m² 且低于 50 kg/m² 为重度肥胖症、达到或超过 50 kg/m² 为极重度肥胖症。」
  source: 上游事实库 facts_upstream.yaml
