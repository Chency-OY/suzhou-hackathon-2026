version: 1
cases:
  - id: strong_a
    level: strong
    expected: [65, 100]
    turns:
      - [doctor, "我只有三分钟，你说重点。"]
      - [rep, "谢谢您抽时间。今天想先听听，您在长期管理中最关注患者的哪些问题？"]
      - [doctor, "我主要担心能否坚持治疗，以及不良反应。"]
      - [rep, "您关注长期坚持和不良反应，我先记录下来。具体数字我会对照获批说明书和原始研究核实，再把相关资料发给您，您愿意下周再讨论吗？"]
  - id: strong_b
    level: strong
    expected: [65, 100]
    turns:
      - [doctor, "我已经有常用方案，不想听空泛的优势。"]
      - [rep, "理解您更看重熟悉的方案。哪些患者管理难点让您最不愿意更换方案？"]
      - [doctor, "主要是耐受性和后续随访。"]
      - [rep, "这两个顾虑很关键。我不想凭印象比较药物，先按获批说明书和原始研究整理耐受性与随访资料，随后请您看看是否值得再谈，您方便吗？"]
  - id: medium_a
    level: medium
    expected: [30, 80]
    turns:
      - [doctor, "你今天有什么事？"]
      - [rep, "您好，我想介绍一下我们的产品，资料里有一些研究结果。"]
      - [doctor, "跟我目前使用的方案相比有什么依据？"]
      - [rep, "我手头没有原始出处，回去查清楚后再给您资料。下周方便再聊吗？"]
  - id: medium_b
    level: medium
    expected: [30, 80]
    turns:
      - [doctor, "我只关心患者能不能坚持治疗。"]
      - [rep, "好的，您一般遇到哪些坚持治疗的障碍？"]
      - [doctor, "不良反应和复诊安排。"]
      - [rep, "我们也有一些资料，可以给您看一看。"]
  - id: weak_a
    level: weak
    expected: [0, 60]
    turns:
      - [doctor, "我担心患者出现不良反应。"]
      - [rep, "不用担心，我们的产品无副作用，保证有效，您直接换就行。"]
      - [doctor, "这些说法有依据吗？"]
      - [rep, "反正大家都这么用，您照做就好。"]
  - id: weak_b
    level: weak
    expected: [0, 60]
    turns:
      - [doctor, "我现在的方案挺稳定。"]
      - [rep, "司美格鲁肽没用，您别犹豫，马上换我们的产品。"]
      - [doctor, "你没有回答我的问题。"]
      - [rep, "不用再问了，听我的就行。"]
